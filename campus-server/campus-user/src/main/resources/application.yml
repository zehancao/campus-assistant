spring:
  application:
    name: campus-server
  datasource:
    url: jdbc:mysql://localhost:3306/campus_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 开发时打印SQL
    map-underscore-to-camel-case: true

# Knife4j API文档配置
springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: '用户模块'
      paths-to-match: /api/user/**
    - group: '课表模块'
      paths-to-match: /api/course/**,/api/classroom/**
    - group: '交易模块'
      paths-to-match: /api/product/**,/api/lostfound/**
    - group: '公告模块'
      paths-to-match: /api/announce/**,/api/event/**,/api/notification/**
    - group: 'AI模块'
      paths-to-match: /api/ai/**

# JWT
campus:
  jwt:
    secret: campus-assistant-secret-key-2024-this-is-256-bits-long!!
    expire-ms: 7200000

logging:
  level:
    com.campus: debug
